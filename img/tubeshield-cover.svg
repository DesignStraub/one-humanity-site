<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a3a"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".18" cy=".1" r=".6">
      <stop offset="0" stop-color="#b9d8ea" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b9d8ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".9" cy=".95" r=".55">
      <stop offset="0" stop-color="#ead3bd" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ead3bd" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#glowA)"/>
  <rect width="1600" height="1200" fill="url(#glowB)"/>

  <!-- browser toolbar hint -->
  <rect x="220" y="150" width="1160" height="76" rx="38" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="270" cy="188" r="9" fill="#ffffff" fill-opacity=".22"/>
  <circle cx="300" cy="188" r="9" fill="#ffffff" fill-opacity=".22"/>
  <circle cx="330" cy="188" r="9" fill="#ffffff" fill-opacity=".22"/>
  <rect x="560" y="168" width="480" height="40" rx="20" fill="#ffffff" fill-opacity=".08"/>
  <!-- extension button in the toolbar -->
  <rect x="1270" y="162" width="52" height="52" rx="16" fill="#eef3f6"/>
  <path d="M1296 172l16 6v10c0 10-7 17-16 20-9-3-16-10-16-20v-10z" fill="#101826"/>

  <!-- popup -->
  <g filter="url(#shadow)">
    <path d="M1296 244l-22 26h44z" fill="#f7f4ee"/>
    <rect x="890" y="266" width="500" height="600" rx="36" fill="#f7f4ee"/>
  </g>

  <!-- popup content -->
  <g transform="translate(940 320)">
    <!-- big shield -->
    <path d="M200 0l120 44v86c0 82-52 140-120 166C132 270 80 212 80 130V44z" fill="#101826"/>
    <path d="M152 140l34 34 66-70" fill="none" stroke="#f7f4ee" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- switch row 1 -->
    <rect x="0" y="340" width="400" height="80" rx="22" fill="#101826" fill-opacity=".06"/>
    <rect x="28" y="370" width="190" height="20" rx="10" fill="#101826" fill-opacity=".55"/>
    <rect x="292" y="356" width="88" height="48" rx="24" fill="#2F6B55"/>
    <circle cx="356" cy="380" r="19" fill="#ffffff"/>

    <!-- switch row 2 -->
    <rect x="0" y="440" width="400" height="80" rx="22" fill="#101826" fill-opacity=".06"/>
    <rect x="28" y="470" width="230" height="20" rx="10" fill="#101826" fill-opacity=".55"/>
    <rect x="292" y="456" width="88" height="48" rx="24" fill="#2F6B55"/>
    <circle cx="356" cy="480" r="19" fill="#ffffff"/>
  </g>

  <!-- left: a page with blocked slots and a playing video -->
  <g transform="translate(220 290)">
    <rect x="0" y="0" width="600" height="338" rx="28" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="300" cy="169" r="56" fill="#eef3f6" fill-opacity=".92"/>
    <path d="M284 140v58l46-29z" fill="#101826"/>
    <rect x="28" y="300" width="544" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>
    <rect x="28" y="300" width="330" height="8" rx="4" fill="#eef3f6"/>

    <rect x="0" y="372" width="600" height="28" rx="14" fill="#ffffff" fill-opacity=".14"/>
    <rect x="0" y="420" width="420" height="22" rx="11" fill="#ffffff" fill-opacity=".09"/>

    <!-- crossed-out ad slots -->
    <g stroke="#ffffff" stroke-opacity=".32" stroke-width="3" fill="none">
      <rect x="0" y="476" width="284" height="100" rx="20" stroke-dasharray="12 10"/>
      <rect x="316" y="476" width="284" height="100" rx="20" stroke-dasharray="12 10"/>
      <path d="M118 502l48 48M166 502l-48 48"/>
      <path d="M434 502l48 48M482 502l-48 48"/>
    </g>
  </g>
</svg>
